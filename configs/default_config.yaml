# Default Configuration for LLM Fine-tuning Pipeline
# Optimized for Windows + 12GB VRAM GPU

# Model Configuration
model:
  name: "LiquidAI/LFM2.5-1.2B-Instruct"  # LFM 2.5 Thinking model
  # Alternative LFM models:
  # - "LiquidAI/LFM2.5-1.2B-Base"
  # - "LiquidAI/LFM2.5-1.2B-Instruct"
  trust_remote_code: false
  hf_token: null  # Set your HuggingFace token if using gated models

# Attention Backend Configuration
# Choose ONE: 'flash_attention' or 'sageattention'
# No fallback - must match installed packages
# 
# RECOMMENDATION for Windows + 12GB VRAM:
# - Start with "sageattention" (universal support, easy install)
# - Use "flash_attention" if you need maximum speed with Llama/Qwen/Mistral
#
attention_backend: "sageattention"  # Recommended: universal support
# attention_backend: "flash_attention"  # Alternative: faster for Llama/Qwen/Mistral

# Quantization Configuration
# With Flash/SAGE Attention, 16-bit is often sufficient for smaller models
# 4-bit/8-bit only needed for larger models or if model doesn't fit
quantization:
  load_in_4bit: false   # Requires bitsandbytes
  load_in_8bit: false   # Requires bitsandbytes
  load_in_16bit: true   # Default, no bitsandbytes needed

# LoRA Configuration (optimized for 12GB VRAM)
# For LFM 2.5 (small model), we can use higher rank for better performance
lora:
  r: 32                    # LoRA rank (higher for smaller models like LFM 2.5)
  lora_alpha: 32          # LoRA alpha (typically 2x rank)
  lora_dropout: 0         # LoRA dropout (0 is optimized)
  bias: "none"            # Bias setting (none is optimized)
  target_modules:         # Modules to apply LoRA to (LFM uses standard architecture)
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"  # Memory efficient
  use_rslora: false       # Rank stabilized LoRA

# Training Configuration (12GB VRAM optimized)
# For LFM 2.5 (1.2B model), we can use longer sequences and larger batches
training:
  max_seq_length: 4096     # LFM supports long context (32k), but 4k is good for training
  per_device_train_batch_size: 2  # LFM 2.5 is small, can use batch size 2
  gradient_accumulation_steps: 4   # Effective batch size = 8
  warmup_steps: 10
  max_steps: 200          # Adjust based on your needs
  logging_steps: 1
  optim: "adamw_8bit"     # Memory efficient optimizer
  seed: 3407
  fp16: false             # Use bf16 if supported
  bf16: true             # Better than fp16 if GPU supports
  report_to: null         # Set to "wandb" or "tensorboard" if desired
  # Training optimization mode
  # Options: 'standard', 'responses_only', 'completions_only'
  optimization_mode: 'responses_only'

  # Validation during training (runs only when val_dataset is provided)
  # eval_strategy: 'no' | 'steps' | 'epoch' — when to run validation
  eval_strategy: 'steps'
  eval_steps: 25              # Evaluate every N steps (when eval_strategy is 'steps')
  eval_delay: 0               # Steps/epochs to wait before first evaluation
  per_device_eval_batch_size: 2  # Can often be higher than train batch (no gradients)
  # Load best checkpoint at end (by validation metric)
  load_best_model_at_end: true
  metric_for_best_model: 'eval_loss'  # Lower is better for loss
  greater_is_better: false    # Loss: lower = better
  save_strategy: 'steps'      # Must align with eval_strategy when using load_best_model_at_end
  save_steps: 25              # Save every N steps (should match eval_steps for best-model selection)
  save_total_limit: 3         # Keep only last N checkpoints (best always retained)

  # Early stopping: stop training when validation stops improving
  # Requires validation dataset + eval_strategy != 'no'. Saves compute if model plateaus early.
  early_stopping_patience: 3   # Stop after N evals with no improvement (0 = disabled)
  early_stopping_threshold: 0.0  # Min improvement to count as "better" (e.g. 0.01 = 1% for loss)

# Dataset Configuration
dataset:
  raw_path: "data/raw"
  processed_path: "data/processed"
  generated_path: "data/generated"
  train_ratio: 0.9
  val_ratio: 0.1

# LM Studio Configuration (for dataset generation)
lm_studio:
  api_url: "http://localhost:1234"
  max_tokens: 512
  temperature: 0.7
  timeout: 60

# Evaluation Configuration
# Settings for testing and evaluating saved models
evaluation:
  # GGUF model settings (llama-cpp-python)
  gguf_n_ctx: 2048          # Context window size for GGUF (lower = more stable)
  gguf_n_batch: 512         # Batch size for prompt processing

  # General evaluation settings
  num_samples: 10           # Number of samples to evaluate
  max_new_tokens: 200       # Max tokens to generate per sample

# Export Configuration
# LoRA / merged use Unsloth when available. GGUF uses llama.cpp directly
# (not Unsloth) for Windows compatibility — Unsloth GGUF often fails on Windows.
export:
  export_lora: false        # Save LoRA adapter (recommended)
  export_merged: false      # Merge and save 16-bit model
  export_gguf: true        # GGUF via llama.cpp (Windows-friendly)
  gguf_quantization_methods:
    - "q4_k_m"             # 4-bit (recommended)
    # - "q5_k_m"            # 5-bit (better quality)
    # - "q8_0"              # 8-bit (high quality)

  # Push to Hugging Face Hub (optional)
  push_to_hub: false
  hub_repo_id: "your-username/your-model-name"
  push_lora: false
  push_merged: false
  push_gguf: false

# Output Configuration
output:
  base_dir: "outputs"
  checkpoint_dir: "checkpoints"
  export_dir: "exports"

# Full Fine-tuning (not recommended for 12GB VRAM)
full_finetuning: false
